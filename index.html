<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AoO Battle Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0c08; --bg2: #1a1208; --bg3: #1a0e00;
    --gold: #f4d03f; --gold2: #8b6914; --gold3: #5a4010;
    --teamA: #3b82f6; --teamA-light: #93c5fd; --teamA-bg: rgba(59,130,246,0.15);
    --teamB: #ef4444; --teamB-light: #fca5a5; --teamB-bg: rgba(239,68,68,0.15);
    --text: #e8d5a3; --sub: #8b6914; --border: #3a2a00;
  }
  body { font-family: 'Barlow', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  /* HEADER */
  header {
    background: linear-gradient(90deg,#1a0a00,#2d1500,#1a0a00);
    border-bottom: 2px solid var(--gold2);
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon { font-size:26px; }
  .logo-title { font-family:'Cinzel',serif; font-size:18px; font-weight:700; color:var(--gold); letter-spacing:2px; }
  .logo-sub { font-size:10px; color:var(--gold2); letter-spacing:3px; }
  nav { display:flex; gap:6px; }
  nav button {
    font-family:'Barlow',sans-serif; font-size:11px; font-weight:600;
    padding:5px 14px; border-radius:4px; cursor:pointer; letter-spacing:1px;
    text-transform:uppercase; transition:all 0.2s;
    border:1px solid var(--gold3); background:transparent; color:var(--gold2);
  }
  nav button.active { background:var(--gold2); border-color:var(--gold); color:var(--gold); }

  /* TABS */
  .tab { display:none; }
  .tab.active { display:flex; flex-direction:column; }

  /* MAP TAB */
  #tab-map { flex-direction:row; height:calc(100vh - 58px); overflow:hidden; }
  .map-area { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; align-items:center; }
  .map-wrap {
    position:relative; border-radius:8px; overflow:hidden;
    border:2px solid var(--gold3);
    box-shadow:0 0 40px rgba(139,105,20,0.25), 0 0 80px rgba(0,0,0,0.5);
  }
  .map-wrap img { display:block; max-width:100%; height:auto; }

  /* Building pins */
  .pin {
    position:absolute; transform:translate(-50%,-50%);
    cursor:pointer; transition:all 0.15s; z-index:5;
  }
  .pin:hover .pin-inner { transform:scale(1.1); box-shadow:0 0 16px currentColor; }
  .pin.selected .pin-inner { transform:scale(1.15); outline:3px solid var(--gold); outline-offset:2px; }
  /* Static pins (obelisks, outposts, ARK) — faint label only */
  .pin-static { cursor:default; pointer-events:none; }
  .pin-static .pin-inner {
    background:rgba(0,0,0,0.35) !important; border-color:rgba(255,255,255,0.15) !important;
    transform:none !important; box-shadow:none !important;
  }
  .pin-static .pin-icon { display:none; }
  .pin-static .pin-label { font-size:7px !important; color:rgba(255,255,255,0.45) !important; font-weight:400 !important; }
  /* Interactive pins (shrines, altars) — vivid, with pulse on hover */
  .pin:not(.pin-static) .pin-inner { box-shadow:0 0 8px currentColor; }
  .pin:not(.pin-static):hover .pin-inner { transform:scale(1.15) !important; }
  .pin-inner {
    border-radius:6px; padding:4px 7px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:all 0.15s; border:2px solid; min-width:52px;
    box-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
  .pin-icon { font-size:13px; line-height:1; }
  .pin-label { font-size:8px; font-weight:700; text-align:center; line-height:1.2; letter-spacing:0.3px; }
  .pin-badges { display:flex; flex-direction:column; gap:2px; width:100%; margin-top:2px; }
  .badge { font-size:7px; padding:1px 4px; border-radius:3px; text-align:center; border:1px solid; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:74px; }
  .badge-a { background:rgba(59,130,246,0.2); border-color:rgba(147,197,253,0.4); color:#93c5fd; }
  .badge-b { background:rgba(239,68,68,0.2); border-color:rgba(252,165,165,0.4); color:#fca5a5; }

  /* SIDE PANEL */
  .side-panel {
    width:270px; min-width:270px; background:#120a00;
    border-left:2px solid var(--gold3);
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:-4px 0 20px rgba(0,0,0,0.4);
    transition:width 0.25s;
  }
  .side-panel.hidden { width:0; min-width:0; border:none; }
  .panel-inner { width:270px; padding:18px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; height:100%; }
  .panel-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .panel-title { font-family:'Cinzel',serif; font-size:15px; color:var(--gold); font-weight:700; }
  .panel-sub { font-size:10px; color:var(--gold2); letter-spacing:2px; margin-bottom:4px; }
  .close-btn { background:none; border:1px solid var(--gold3); color:var(--gold2); cursor:pointer; border-radius:4px; padding:2px 8px; font-size:14px; }
  hr.divider { border:none; border-top:1px solid var(--border); }
  .field-group { display:flex; flex-direction:column; gap:6px; }
  .field-label { font-size:10px; letter-spacing:2px; display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  select, textarea {
    width:100%; background:#1a1000; border:1px solid var(--gold3);
    color:var(--text); border-radius:5px; padding:7px 9px;
    font-family:'Barlow',sans-serif; font-size:11px; cursor:pointer; outline:none;
    transition:border-color 0.2s;
  }
  select:focus, textarea:focus { border-color:var(--gold2); }
  textarea { resize:vertical; min-height:60px; font-size:10px; }
  .clear-btn {
    background:transparent; border:1px solid #5a1010; color:#ef4444;
    padding:6px; border-radius:4px; cursor:pointer;
    font-family:'Barlow',sans-serif; font-size:10px; letter-spacing:1px; width:100%;
    transition:all 0.2s;
  }
  .clear-btn:hover { background:#5a1010; }

  /* ROSTER TAB */
  #tab-roster { padding:28px; max-width:480px; margin:0 auto; }
  .tab-title { font-family:'Cinzel',serif; font-size:18px; color:var(--gold); font-weight:700; margin-bottom:20px; letter-spacing:2px; }
  .add-row { display:flex; gap:8px; margin-bottom:20px; }
  .add-row input {
    flex:1; background:#1a1000; border:1px solid var(--gold3);
    color:var(--text); border-radius:6px; padding:8px 12px;
    font-family:'Barlow',sans-serif; font-size:13px; outline:none;
  }
  .add-btn {
    background:var(--gold3); border:1px solid var(--gold2); color:var(--gold);
    padding:8px 16px; border-radius:6px; cursor:pointer;
    font-family:'Barlow',sans-serif; font-size:13px; font-weight:700;
    transition:all 0.2s;
  }
  .add-btn:hover { background:var(--gold2); }
  .player-list { display:flex; flex-direction:column; gap:6px; }
  .player-row {
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--border); border-radius:6px; padding:9px 14px;
  }
  .player-row:nth-child(odd) { background:#1a1000; }
  .player-row:nth-child(even) { background:#150e00; }
  .player-num { color:var(--gold3); font-size:12px; font-weight:700; min-width:20px; }
  .player-name { color:var(--text); font-size:13px; }
  .remove-btn { background:none; border:none; color:#5a2020; cursor:pointer; font-size:16px; padding:0 4px; }
  .remove-btn:hover { color:#ef4444; }

  /* SUMMARY TAB */
  #tab-summary { padding:28px; max-width:680px; margin:0 auto; overflow-y:auto; }
  .summary-grid { display:flex; flex-direction:column; gap:10px; }
  .summary-card {
    border-left:3px solid; border-radius:6px; padding:12px 16px;
    background:#1a1000;
  }
  .summary-card-title { font-size:13px; font-weight:700; margin-bottom:8px; }
  .summary-assignments { display:flex; gap:16px; flex-wrap:wrap; }
  .summary-assign { font-size:11px; }
  .summary-notes { font-size:10px; color:var(--gold2); margin-top:6px; font-style:italic; }
  .empty-state { color:var(--gold3); font-size:13px; text-align:center; margin-top:60px; }

  /* Legend */
  .legend { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .legend-item { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--gold2); }
  .legend-dot { width:10px; height:10px; border-radius:50%; border:1px solid; }

  /* Tablet (iPad) */
  @media (max-width:1100px) and (min-width:701px) {
    .side-panel { width:220px; min-width:220px; }
    .panel-inner { width:220px; padding:12px; }
    .logo-title { font-size:15px; }
    nav button { padding:4px 10px; font-size:10px; }
    #tab-roster, #tab-summary { padding:16px; }
  }
  /* Mobile */
  @media (max-width:700px) {
    #tab-map { flex-direction:column; height:auto; overflow:visible; }
    .map-area { padding:6px; }
    .side-panel { position:fixed; right:0; top:52px; bottom:0; z-index:50; width:85vw; max-width:300px; }
    .side-panel.hidden { width:0; min-width:0; }
    header { padding:6px 10px; }
    .logo-title { font-size:13px; letter-spacing:1px; }
    .logo-sub { display:none; }
    nav button { padding:4px 8px; font-size:9px; }
    #tab-roster, #tab-summary { padding:12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚰️</div>
    <div>
      <div class="logo-title">AoO BATTLE PLANNER</div>
      <div class="logo-sub">ARK OF OSIRIS — TACTICAL MAP</div>
    </div>
  </div>
  <nav>
    <button class="active" onclick="switchTab('map')">🗺️ Map</button>
    <button onclick="switchTab('roster')">👥 Roster</button>
    <button onclick="switchTab('summary')">📋 Summary</button>
  </nav>
</header>

          <option value="">— Select player —</option>
        </select>

          <option value="">— Role —</option>
        </select>

<div id="tab-roster" class="tab">
  <div class="tab-title">👥 PLAYER ROSTER</div>
  <div class="add-row">
    <input type="text" id="newPlayerInput" placeholder="Add player name..." onkeydown="if(event.key==='Enter')addPlayer()">
    <button class="add-btn" onclick="addPlayer()">ADD</button>
  </div>
  <div class="player-list" id="playerList"></div>
</div>

<!-- SUMMARY TAB -->
<div id="tab-summary" class="tab">
  <div class="tab-title">📋 ASSIGNMENT SUMMARY</div>
  <div class="summary-grid" id="summaryGrid"></div>
</div>

<script>
const BUILDINGS = [
  {id:"obs_top",    label:"Obelisk",         type:"obelisk", x:53.5, y:13.5},
  {id:"obs_left",   label:"Obelisk",         type:"obelisk", x:10.5, y:43.5},
  {id:"obs_bot",    label:"Obelisk",         type:"obelisk", x:41.5, y:81.5},
  {id:"obs_right",  label:"Obelisk",         type:"obelisk", x:86.5, y:47.5},
  {id:"alt_dt",     label:"Desert Altar",    type:"altar",   x:53.8, y:31.5},
  {id:"alt_db",     label:"Desert Altar",    type:"altar",   x:41.5, y:63.5},
  {id:"shr_lt",     label:"Shrine of Life",  type:"shrine",  x:68.5, y:16.5},
  {id:"shr_lb",     label:"Shrine of Life",  type:"shrine",  x:25.5, y:78.5},
  {id:"shr_wl",     label:"Shrine of War",   type:"shrine",  x:27.0, y:49.5},
  {id:"shr_wr",     label:"Shrine of War",   type:"shrine",  x:65.0, y:43.0},
  {id:"sky_r",      label:"Sky Altar",       type:"sky",     x:82.0, y:28.0},
  {id:"sky_l",      label:"Sky Altar",       type:"sky",     x:11.5, y:60.5},
  {id:"iset_1",     label:"Outpost of Iset", type:"outpost", x:34.5, y:17.5},
  {id:"iset_2",     label:"Outpost of Iset", type:"outpost", x:16.0, y:29.0},
  {id:"iset_3",     label:"Outpost of Iset", type:"outpost", x:33.5, y:32.5},
  {id:"seth_1",     label:"Outpost of Seth", type:"outpost", x:62.0, y:61.0},
  {id:"seth_2",     label:"Outpost of Seth", type:"outpost", x:78.5, y:61.5},
  {id:"seth_3",     label:"Outpost of Seth", type:"outpost", x:62.5, y:76.0},
  {id:"ark",        label:"ARK",             type:"ark",     x:46.5, y:47.5},
];

const TYPE_STYLE = {
  obelisk: {bg:"#1a3a5c", border:"#4a9eda", icon:"🗿", color:"#7dd3fc"},
  altar:   {bg:"#3b1f00", border:"#f59e0b", icon:"⛩️",  color:"#fcd34d"},
  shrine:  {bg:"#1a2e1a", border:"#4ade80", icon:"🏛️", color:"#86efac"},
  sky:     {bg:"#1e1b4b", border:"#a78bfa", icon:"☁️",  color:"#c4b5fd"},
  outpost: {bg:"#2d2010", border:"#d97706", icon:"🏰", color:"#fbbf24"},
  ark:     {bg:"#4a1942", border:"#f0abfc", icon:"⚰️",  color:"#f0abfc"},
};

const ROLES = ["Rally / garrison","Rally / garrison, Team C","Rally / Garrison, Filler","1 troop — fastest cmdr","Garrison Captain","Rally Leader","Backup","Wait list"];

let players = ["Drunkgroot","FairPlay","Tuki","Urin"];
let assignments = {};
let selectedId = null;

// ── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  buildLegend();
  buildPins();
  renderRoster();
  populateRoleSelects();
  // Load from localStorage if available
  try {
    const saved = localStorage.getItem('aoo_data');
    if (saved) {
      const d = JSON.parse(saved);
      players = d.players || players;
      assignments = d.assignments || {};
      renderRoster();
      refreshAllPins();
    }
  } catch(e) {}
}

function save() {
  try { localStorage.setItem('aoo_data', JSON.stringify({players, assignments})); } catch(e){}
}

function populateRoleSelects() {
  ['roleA','roleB'].forEach(id => {
    const sel = document.getElementById(id);
    ROLES.forEach(r => {
      const o = document.createElement('option');
      o.value = o.textContent = r;
      sel.appendChild(o);
    });
  });
}

// ── MAP ───────────────────────────────────────────────────────────────────────

function buildPins() {
  const wrap = document.getElementById('mapWrap');
  BUILDINGS.forEach(b => {
    const interactive = ['shrine','altar','sky'].includes(b.type);
    const pin = document.createElement('div');
    pin.className = interactive ? 'pin' : 'pin pin-static';
    pin.id = 'pin_' + b.id;
    pin.style.left = b.x + '%';
    pin.style.top  = b.y + '%';
    if (interactive) pin.onclick = () => selectBuilding(b.id);
    pin.innerHTML = buildPinHTML(b);
    wrap.appendChild(pin);
  });
}

function buildPinHTML(b) {
  const s = TYPE_STYLE[b.type];
  const a = assignments[b.id] || {};
  const isArk = b.type === 'ark';
  return `<div class="pin-inner" style="background:${s.bg};border-color:${s.border};${isArk?'border-radius:8px;min-width:62px;':''}">
    <span class="pin-icon">${s.icon}</span>
    <span class="pin-label" style="color:${s.color}">${b.label}</span>
    ${a.playerA || a.playerB ? `<div class="pin-badges">
      ${a.playerA ? `<div class="badge badge-a">A: ${a.playerA}</div>` : ''}
      ${a.playerB ? `<div class="badge badge-b">B: ${a.playerB}</div>` : ''}
    </div>` : ''}
  </div>`;
}

function refreshAllPins() {
  BUILDINGS.forEach(b => {
    const pin = document.getElementById('pin_' + b.id);
    if (pin) pin.innerHTML = buildPinHTML(b);
  });
}

function buildLegend() {
  const leg = document.getElementById('legend');
  Object.entries(TYPE_STYLE).forEach(([type, s]) => {
    leg.innerHTML += `<div class="legend-item">
      <div class="legend-dot" style="background:${s.bg};border-color:${s.border}"></div>
      ${s.icon} ${type}
    </div>`;
  });
}

// ── PANEL ─────────────────────────────────────────────────────────────────────
function selectBuilding(id) {
  // Deselect old
  if (selectedId) document.getElementById('pin_' + selectedId)?.classList.remove('selected');
  selectedId = id;
  document.getElementById('pin_' + id)?.classList.add('selected');

  const b = BUILDINGS.find(x => x.id === id);
  const s = TYPE_STYLE[b.type];
  const a = assignments[id] || {};

  document.getElementById('panelTitle').textContent = s.icon + ' ' + b.label;
  document.getElementById('sidePanel').classList.remove('hidden');

  // Populate player selects
  ['playerA','playerB'].forEach(field => {
    const sel = document.getElementById(field);
    sel.innerHTML = '<option value="">— Select player —</option>';
    players.forEach(p => {
      const o = document.createElement('option');
      o.value = o.textContent = p;
      if (a[field] === p) o.selected = true;
      sel.appendChild(o);
    });
  });

  document.getElementById('roleA').value  = a.roleA  || '';
  document.getElementById('roleB').value  = a.roleB  || '';
  document.getElementById('noteField').value = a.notes || '';
}

function assign(field) {
  if (!selectedId) return;
  if (!assignments[selectedId]) assignments[selectedId] = {};
  const el = document.getElementById(field === 'notes' ? 'noteField' : field);
  assignments[selectedId][field] = el.value;
  const pin = document.getElementById('pin_' + selectedId);
  if (pin) pin.innerHTML = buildPinHTML(BUILDINGS.find(b => b.id === selectedId));
  save();
}

function clearAssignment() {
  if (!selectedId) return;
  delete assignments[selectedId];
  const pin = document.getElementById('pin_' + selectedId);
  if (pin) pin.innerHTML = buildPinHTML(BUILDINGS.find(b => b.id === selectedId));
  document.getElementById('playerA').value = '';
  document.getElementById('playerB').value = '';
  document.getElementById('roleA').value = '';
  document.getElementById('roleB').value = '';
  document.getElementById('noteField').value = '';
  save();
}

function closePanel() {
  document.getElementById('sidePanel').classList.add('hidden');
  if (selectedId) document.getElementById('pin_' + selectedId)?.classList.remove('selected');
  selectedId = null;
}

// ── ROSTER ────────────────────────────────────────────────────────────────────
function renderRoster() {
  const list = document.getElementById('playerList');
  list.innerHTML = '';
  players.forEach((p, i) => {
    list.innerHTML += `<div class="player-row">
      <span class="player-num">${i+1}</span>
      <span class="player-name">${p}</span>
      <button class="remove-btn" onclick="removePlayer('${p}')">✕</button>
    </div>`;
  });
}

function addPlayer() {
  const inp = document.getElementById('newPlayerInput');
  const name = inp.value.trim();
  if (name && !players.includes(name)) {
    players.push(name);
    inp.value = '';
    renderRoster();
    save();
  }
}

function removePlayer(name) {
  players = players.filter(p => p !== name);
  renderRoster();
  save();
}

// ── SUMMARY ───────────────────────────────────────────────────────────────────
function renderSummary() {
  const grid = document.getElementById('summaryGrid');
  const assigned = BUILDINGS.filter(b => assignments[b.id]?.playerA || assignments[b.id]?.playerB);
  if (!assigned.length) {
    grid.innerHTML = '<div class="empty-state">No assignments yet.<br>Click buildings on the map to assign players.</div>';
    return;
  }
  grid.innerHTML = assigned.map(b => {
    const s = TYPE_STYLE[b.type];
    const a = assignments[b.id];
    return `<div class="summary-card" style="border-color:${s.border}">
      <div class="summary-card-title" style="color:${s.color}">${s.icon} ${b.label}</div>
      <div class="summary-assignments">
        ${a.playerA ? `<div class="summary-assign"><span style="color:#93c5fd">A: ${a.playerA}</span>${a.roleA ? ` <span style="color:#5a4010">— ${a.roleA}</span>` : ''}</div>` : ''}
        ${a.playerB ? `<div class="summary-assign"><span style="color:#fca5a5">B: ${a.playerB}</span>${a.roleB ? ` <span style="color:#5a4010">— ${a.roleB}</span>` : ''}</div>` : ''}
      </div>
      ${a.notes ? `<div class="summary-notes">📝 ${a.notes}</div>` : ''}
    </div>`;
  }).join('');
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('nav button').forEach(b => {
    if (b.textContent.toLowerCase().includes(name)) b.classList.add('active');
  });
  if (name === 'summary') renderSummary();
}

init();
</script>
</body>
</html>
